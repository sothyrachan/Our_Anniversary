<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffc2d1" />
    <title>For You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/envelope.css" />
  </head>
  <body>
    <!-- Floating background hearts -->
    <div class="floaties" aria-hidden="true">
      <span style="--x: 8%; --s: 22px; --d: 14s; --delay: 0s"></span>
      <span style="--x: 22%; --s: 14px; --d: 11s; --delay: 3s"></span>
      <span style="--x: 37%; --s: 26px; --d: 16s; --delay: 6s"></span>
      <span style="--x: 52%; --s: 16px; --d: 12s; --delay: 1s"></span>
      <span style="--x: 66%; --s: 24px; --d: 15s; --delay: 4s"></span>
      <span style="--x: 80%; --s: 12px; --d: 10s; --delay: 7s"></span>
      <span style="--x: 92%; --s: 20px; --d: 13s; --delay: 2s"></span>
    </div>

    <main class="stage">
      <p class="hint" id="hint">
        <span class="hint-title">Hey love, Kimsreng!</span>
        <span class="hint-sub">I made something for you handsome</span>
      </p>

      <div class="envelope-wrap">
        <!-- Envelope (pure CSS) -->
        <div
          class="envelope"
          id="envelope"
          role="group"
          aria-label="A sealed envelope with a card inside"
        >
          <div class="env-back"></div>

          <div class="env-card">
            <div class="card-text">
              <span class="card-to">To my most favorite person,</span>
              <span class="card-main">Happy 5th Anniversary, pd sml.</span>
              <span class="card-note">
                Click next to see our beautiful moments together 💗
              </span>
            </div>
          </div>

          <div class="env-pocket env-left"></div>
          <div class="env-pocket env-right"></div>
          <div class="env-pocket env-bottom"></div>
          <div class="env-lines"></div>
          <div class="env-flap"></div>

          <div class="env-seal">
            <img src="assets/images/heart.svg" alt="" />
          </div>
        </div>

        <!-- Twinkles around the envelope -->
        <i class="sparkle" aria-hidden="true" style="--x: -5%; --y: 8%; --s: 1.3rem; --delay: 0s">✦</i>
        <i class="sparkle" aria-hidden="true" style="--x: 98%; --y: 2%; --s: 1rem; --delay: 0.9s">✦</i>
        <i class="sparkle" aria-hidden="true" style="--x: 104%; --y: 62%; --s: 1.4rem; --delay: 1.7s">✦</i>
        <i class="sparkle" aria-hidden="true" style="--x: -7%; --y: 70%; --s: 0.9rem; --delay: 1.2s">✦</i>
        <i class="sparkle" aria-hidden="true" style="--x: 48%; --y: -14%; --s: 0.8rem; --delay: 0.4s">✦</i>
      </div>

      <div class="actions">
        <button id="openBtn" class="btn" type="button">Open it</button>
        <a id="nextBtn" class="btn btn-next" href="gallery.html">Next</a>
      </div>
    </main>

    <!-- Background music playlist (songs are listed in js/music.js) -->
    <audio id="bgMusic" data-persist preload="auto"></audio>
    <button
      id="musicToggle"
      data-persist
      class="music-toggle"
      type="button"
      aria-label="Toggle music"
    >♪</button>

    <script src="js/music.js" data-persist></script>
    <script src="js/router.js" data-persist></script>
    <script type="module" src="js/envelope.js"></script>
  </body>
</html>
